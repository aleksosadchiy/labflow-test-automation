# Run test methods and test classes in a random order. If any check secretly depended on
# another one having run first, a random order would expose it sooner or later, so this
# actively proves the checks are independent of each other.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random

# Time limit of the framework's own Jupiter self-checks (those that open a browser): 2 minutes, on
# a separate thread, so a stuck driver call fails the self-check instead of hanging the run. The
# screen scenarios are not reached by it (Cucumber has no per-scenario limit): their 2-minute limit
# is the ScenarioWatchdog started by the hooks (spec 008), and Surefire's fork timeout
# (surefire.timeout in ui-tests/pom.xml, 600 s) is the backstop for a call that ignores interruption.
junit.jupiter.execution.timeout.default=2m
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD

# Run the Jupiter self-checks side by side, like api-tests. Every self-check makes its own uniquely
# named data, and every worker thread has its own Playwright + Browser (BrowserPool), so checks
# share neither data nor browser objects. The random order above still shuffles them. How many run
# at once comes from ChecksAtOnceStrategy: -DchecksAtOnce=N, or one per processor core when it is
# not set (-DchecksAtOnce=1 runs them one at a time, on one browser).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=custom
junit.jupiter.execution.parallel.config.custom.class=com.labflow.common.junit.ChecksAtOnceStrategy

# Switch off Allure's own auto-registered JUnit Platform listener (allure-jupiter brings it
# in): it would record every test, including the framework's self-checks, and record the
# scenarios a second time. Only Allure's Cucumber adapter records, so the report holds the lab
# checks (the scenarios) and nothing else.
junit.platform.execution.listeners.deactivate=io.qameta.allure.junitplatform.AllureJunitPlatform

# The screen checks are Gherkin scenarios (spec 008), run by the Cucumber engine. The feature files
# are selected by ScreenScenariosTest (a JUnit suite), not here: Surefire reports a test only when
# it belongs to a class, so scenarios found directly by the engine would never fail the build. Only
# the packages of the steps and of the hooks are searched for glue code.
cucumber.glue=com.labflow.ui.tests.steps,com.labflow.ui.tests.hooks

# Scenarios run side by side, in a random order, under the same limit as the Jupiter self-checks:
# ChecksAtOnceStrategy decides how many (-DchecksAtOnce=N, or one per processor core).
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=custom
cucumber.execution.parallel.config.custom.class=com.labflow.common.junit.ChecksAtOnceStrategy
cucumber.execution.order=random

# A scenario is reported under exactly its short name, and an outline row under its own name (the
# scenario's title with the row's values filled in). "long" would join feature, scenario and row.
cucumber.junit-platform.naming-strategy=short
cucumber.junit-platform.naming-strategy.short.example-name=pickle

# Allure's Cucumber adapter records each scenario with its Gherkin lines as steps. Quiet publish
# keeps Cucumber from printing its "publish your report" advert on the console.
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
