# Run test methods and test classes in a random order. If any check secretly depended on
# another one having run first, a random order would expose it sooner or later, so this
# actively proves the checks are independent of each other.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random

# Per-check time limit (spec 004, Slice 8): guards against the kind of stall found while
# diagnosing this slice (a full run once stalled ~15 min; a single check once took 905 s), for
# which every Playwright *wait* is already capped at 30 s but a handful of driver calls
# (Playwright.create/close, Browser.newContext, BrowserContext.close, Browser.close, every
# Tracing.* call) have no timeout option of their own and can only be stopped from outside.
# The slowest observed check (the full screen-journey test) takes ~2.5 s, so 2 minutes leaves
# generous headroom for a slow CI runner while still failing well inside "a few minutes".
#
# Thread mode, decided by experiment (see the Slice 8 Task 2 report for the runs):
# - SAME_THREAD sends Thread.interrupt() to the test's own thread when the limit is hit. That
#   unblocks an interruptible wait (proven: a CountDownLatch.await() failed right at the limit
#   and the run carried on). But a call that does not check its interrupted status - which is
#   exactly how the flagged Playwright driver calls behave - never returns, so the run hangs
#   forever regardless of this setting (proven: a busy loop past the limit pegged the forked
#   JVM at ~99% CPU with no result for 2+ minutes, requiring kill -9). That defeats the whole
#   point of this guard.
# - SEPARATE_THREAD runs the check on a throwaway daemon thread and simply stops waiting for it
#   once the limit passes, so the run always continues (proven: the same busy loop failed at
#   the limit and the run finished normally). The abandoned thread keeps running in the
#   background for the rest of the process, so if it goes on to touch a Playwright object
#   after its BrowserContext has been closed by afterEach on the main thread, that collides
#   with the single, shared, not-thread-safe Playwright connection this module deliberately
#   reuses across every check (BrowserExtension) - proven experimentally: this produced a burst
#   of unrelated "Object doesn't exist" failures in later, otherwise-unaffected checks. That
#   collateral noise is still a world away from a run that never ends: it is a small number of
#   loud, visible failures inside the same run, not a silent stall that needs a manual kill.
#   SEPARATE_THREAD is the setting here because "the run must continue with the next check" is
#   the property being guarded, and only SEPARATE_THREAD provides it unconditionally.
#
# Known gap, covered by a backstop: this configuration times out an @Test/@BeforeEach/
# @AfterEach *method* body. It does not reach code inside a JUnit Extension callback (e.g.
# BrowserExtension.beforeEach/afterEach), because the Jupiter engine invokes those directly
# rather than through the intercepted lifecycle-method path this timeout wraps (confirmed by
# experiment: an unbounded wait placed inside BrowserExtension.beforeEach was not stopped by
# this timeout and hung the run). The exact driver calls called out above run inside those
# callbacks. This limit covers the check bodies. The whole-run backstop in ui-tests/pom.xml
# covers everything else: Surefire's fork timeout (property surefire.timeout = 600 s) kills a
# forked JVM stuck anywhere, including in those callbacks, so a run fails within 10 minutes
# instead of hanging. That failure is loud but not named per check.
junit.jupiter.execution.timeout.default=2m
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
