# Run test methods and test classes in a random order. If any check secretly depended on
# another one having run first, a random order would expose it sooner or later, so this
# actively proves the checks are independent of each other.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random

# Run checks side by side. Every check makes its own uniquely named data, so they cannot see each
# other's records, and the random order above still shuffles them. How many run at once comes from
# ChecksAtOnceStrategy: -DchecksAtOnce=N, or one per processor core when it is not set
# (-DchecksAtOnce=1 runs them one at a time).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=custom
junit.jupiter.execution.parallel.config.custom.class=com.labflow.common.junit.ChecksAtOnceStrategy

# Switch off Allure's own auto-registered listener: it would record every test, including the
# framework's self-checks. LabChecksAllureListener (registered in META-INF/services) records the
# lab checks only.
junit.platform.execution.listeners.deactivate=io.qameta.allure.junitplatform.AllureJunitPlatform
