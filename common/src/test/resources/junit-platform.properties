# allure-junit-platform is on this module's test classpath (provided scope, needed to compile
# LabChecksAllureListener), so its listener would auto-register and write an allure-results folder
# into the source tree. This module reports nothing to Allure; the check modules do.
junit.platform.execution.listeners.deactivate=io.qameta.allure.junitplatform.AllureJunitPlatform
