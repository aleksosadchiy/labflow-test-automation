# CI for the lab test-automation framework (spec 006; the Report job is spec 007).
#   Build      compiles everything and runs the lab-free self-checks.
#   API tests  starts its own Mock Lab and runs the api-tests regression set.
#   UI tests   installs a browser, starts its own Mock Lab and runs the
#              ui-tests regression set. It runs in parallel with API tests.
#   Report     runs after both check jobs, collects their Allure result files
#              and keeps ONE visual report of the run. It can never turn the
#              run red, and it must not be a required check for merging.
# (The two check jobs were named Workflow checks / Screen checks until 2026-10-18.)
name: CI

on:
  # Every push, on any branch, gets a verdict on its commit.
  push:
  # A merge request into main also shows the verdict on the PR page.
  pull_request:
    branches: [main]
  # A hand-started run from the Actions tab. "family" picks which check job(s)
  # run; "browser" picks the browser for the UI tests job.
  workflow_dispatch:
    inputs:
      family:
        description: Which checks to run
        type: choice
        options: [both, api, ui]
        default: both
      browser:
        description: Browser for the screen checks
        type: choice
        options: [chromium, webkit]
        default: chromium

# Least privilege: the jobs only need to read the code. The run summary goes
# through $GITHUB_STEP_SUMMARY, which needs no extra permission (no checks: write).
permissions:
  contents: read

# No "concurrency" block on purpose: when two changes are pushed quickly, both
# runs finish, so every commit gets its own verdict (FS 2.1, the user's decision).

jobs:
  build:
    name: Build
    # Pinned rather than ubuntu-latest, so the runner image cannot change under us.
    runs-on: ubuntu-24.04
    # A hung job is stopped instead of burning runner minutes (FS 2.6).
    timeout-minutes: 15
    steps:
      # Epoch seconds at job start, for the duration line in the summary below.
      - name: Record the job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # fetch-depth: 0 = the whole history, not just the last commit, so the secret
      # scan below also sees a secret that was committed once and removed later.
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Secret scan (gitleaks, rules in .gitleaks.toml): fails the build if any
      # commit holds something that looks like a key, token or password. The
      # binary is pinned to one release and checked against its published
      # SHA-256 before it runs, instead of trusting a third-party action.
      # Dependabot does not see this pin: bump version and checksum together by hand.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact

      # Temurin JDK 17 (the project's Java version). cache: maven restores
      # ~/.m2/repository keyed on every pom.xml, so repeat runs skip downloads.
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Formatting gate (Spotless, configured in both pom.xml files): fails on an
      # unused import, trailing spaces, a tab or a missing final newline. First,
      # because it is the cheapest check. Fix locally with `./mvnw spotless:apply`.
      # The Mock Lab is a separate Maven build, so it is checked separately.
      - name: Check the formatting
        run: |
          ./mvnw -B -ntp spotless:check
          cd mock-lab-app && ./mvnw -B -ntp spotless:check

      # Compile main and test code of every reactor module. -B = batch mode
      # (no colours or prompts), -ntp = no download-progress noise in the log.
      - name: Compile everything
        run: ./mvnw -B -ntp test-compile

      # Lab-free self-checks only. The api-tests and ui-tests modules run a
      # pre-flight listener that needs a running lab before any tag filter
      # applies, so their self-checks run in the check jobs that start a lab.
      - name: Run the lab-free self-checks
        run: ./mvnw -B -ntp test -pl common,test-data,api-client

      # The Maven cache (~/.m2) is saved by Build, so Build must download
      # everything the check jobs need - including the lab's Spring Boot
      # dependencies (mock-lab-app is not in the root reactor). It also fails
      # fast if the lab itself does not compile. The check jobs still build
      # the jar themselves via lab.sh - now from the warm cache.
      - name: Build the Mock Lab (and cache its dependencies)
        run: cd mock-lab-app && ./mvnw -B -ntp -q package -DskipTests

      # Same idea for the Playwright CLI. Nothing else in this job runs it, so the
      # UI tests job used to fetch exec-maven-plugin and its Playwright
      # dependency from Maven Central live in "Install the browser", and one short
      # outage there failed that job (run 38224248594). Running the same goal here
      # with a harmless argument puts exactly those artifacts into the Maven cache.
      # --version prints the CLI version and downloads no browser. The cache is
      # written only when its key (every pom.xml) is new, so this takes effect from
      # the first Build after a pom change.
      - name: Fetch the Playwright CLI (and cache it for UI tests)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./mvnw -B -ntp -N exec:java -Dexec.args="--version"

      # always(): the summary is most useful exactly when a check failed.
      # tee -a: the same Markdown goes to the run page AND into this step's log.
      # One summary per module, each reading only that module's own reports.
      - name: Summarise results
        if: always()
        run: |
          python3 .github/scripts/junit_summary.py "Build: common" common/target/surefire-reports "$JOB_START" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/junit_summary.py "Build: test-data" test-data/target/surefire-reports "$JOB_START" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/junit_summary.py "Build: api-client" api-client/target/surefire-reports "$JOB_START" | tee -a "$GITHUB_STEP_SUMMARY"

  api-tests:
    name: API tests
    # Runs only after Build is green: a broken build skips this job, so the run
    # page shows Build as the failed step (FS 2.2).
    needs: build
    # Push and PR runs always include it; a hand-started run skips it when the
    # engineer picked family=ui.
    if: github.event_name != 'workflow_dispatch' || inputs.family != 'ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Job-level env reaches every step, so the lab (started by lab.sh) and the
    # framework (run by Maven) see exactly the same values.
    env:
      # Spec 005 environment name; the run banner prints it.
      ENVIRONMENT: ci
      # The lab this job starts on its own runner VM, so port 8080 never collides.
      BASE_URL: http://localhost:8080
      # API_TOKEN is not set here on purpose: the "Choose the access key" step
      # sets it, so it is masked before any step header could print it.
    steps:
      # Epoch seconds at job start, for the duration line in the summary below.
      - name: Record the job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the code
        uses: actions/checkout@v7

      # Sets API_TOKEN for the lab AND the framework: the repository secret if one
      # is set, otherwise the lab's documented local key. The script masks the key
      # before exporting it through $GITHUB_ENV (the why is in the script's header).
      # After the checkout, because the script comes from the repository.
      - name: Choose the access key
        env:
          # An unset secret is "", and secret values are always masked by GitHub.
          SECRET_API_TOKEN: ${{ secrets.API_TOKEN }}
        run: .github/scripts/access_key.sh

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Builds the lab jar, starts it in the background and waits until /health
      # answers 200 (seed data loaded), failing with a clear annotation after 60 s.
      # The lab inherits API_TOKEN from $GITHUB_ENV (set by "Choose the access key").
      - name: Start the Mock Lab
        run: .github/scripts/lab.sh start

      # -pl api-tests -am: this module plus the modules it depends on.
      # The tag filter selects the regression lab checks plus this module's own
      # self-checks (untagged by api/ui). Those self-checks run here, not in Build,
      # because the pre-flight listener needs a running lab before any filter applies.
      - name: Run the workflow checks
        run: ./mvnw -B -ntp -pl api-tests -am test -Dgroups="regression | !(api | ui)"

      # always(): the summary is most useful exactly when a check failed.
      # tee -a: the same Markdown goes to the run page AND into this step's log.
      # Only the api-tests module's own reports, so the -am self-checks are not double-counted.
      - name: Summarise results
        if: always()
        run: python3 .github/scripts/junit_summary.py "API tests" api-tests/target/surefire-reports "$JOB_START" | tee -a "$GITHUB_STEP_SUMMARY"

      # always(): stop the lab whether the checks passed, failed or were cancelled.
      - name: Stop the Mock Lab
        if: always()
        run: .github/scripts/lab.sh stop

      # Evidence kept with the run (FS 2.5), placed after "Stop the Mock Lab" so
      # lab-startup.log is complete. always(): the results matter most when a
      # check failed. run_attempt in the name: a re-run uploads a new artifact
      # instead of clashing with the first attempt's. No retention-days: GitHub's
      # 90-day default (the user's decision). GitHub does NOT mask artifact
      # contents; secrets stay out because the framework never writes them
      # (proven by RunLogSecrecyTest for logs and SignInTraceTest for traces).
      # target/allure-results/ (spec 007): one small file per lab check, written
      # to the ROOT target folder because Maven runs from the repo root. The
      # Report job downloads them from this artifact to build the visual report.
      # With several paths the artifact's root is their common parent (here the
      # repo root), so the files sit at target/allure-results/ inside it.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-checks-results-${{ github.run_attempt }}
          path: |
            api-tests/target/surefire-reports/
            api-tests/target/logs/
            mock-lab-app/target/lab-startup.log
            target/allure-results/
          if-no-files-found: warn

  ui-tests:
    # Plain name on purpose: GitHub does not evaluate the name of a skipped job
    # (family=api), so an expression here would show raw as "${{ ... }}". The
    # browser is in the summary title, the cache key and the artifact names.
    # It is also the name to require in branch protection.
    name: UI tests
    # Same gate as API tests: a broken build skips this job (FS 2.2).
    needs: build
    # Push and PR runs always include it; a hand-started run skips it when the
    # engineer picked family=api.
    if: github.event_name != 'workflow_dispatch' || inputs.family != 'api'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: ci
      # This job's own lab, on its own runner VM: no clash with API tests.
      BASE_URL: http://localhost:8080
      # Read by the framework (spec 005) to pick the Playwright browser.
      BROWSER: ${{ inputs.browser || 'chromium' }}
      # API_TOKEN is set by the "Choose the access key" step (see API tests).
    steps:
      # Epoch seconds at job start, for the duration line in the summary below.
      - name: Record the job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the code
        uses: actions/checkout@v7

      # Sets API_TOKEN for the lab AND the framework: the repository secret if one
      # is set, otherwise the lab's documented local key. The script masks the key
      # before exporting it through $GITHUB_ENV (the why is in the script's header).
      # After the checkout, because the script comes from the repository.
      - name: Choose the access key
        env:
          # An unset secret is "", and secret values are always masked by GitHub.
          SECRET_API_TOKEN: ${{ secrets.API_TOKEN }}
        run: .github/scripts/access_key.sh

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The browser build Playwright downloads is tied to the Playwright version,
      # so the version goes into the cache key: bumping it in the pom starts a
      # fresh cache instead of restoring a browser the new client cannot use.
      - name: Read the Playwright version
        id: playwright
        run: |
          VERSION=$(sed -n 's:.*<playwright.version>\(.*\)</playwright.version>.*:\1:p' pom.xml | head -n 1)
          echo "Playwright $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Restores the downloaded browser (Chromium is ~170 MB) from an earlier run,
      # and saves it at the end of the job if there was no hit. One cache per
      # OS + Playwright version + browser, so chromium and webkit never mix.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ env.BROWSER }}

      # Runs Playwright's own CLI through exec-maven-plugin (root pom, -N = this
      # pom only, no reactor build). Always runs, even on a cache hit: the cache
      # holds the browser itself, but --with-deps also apt-installs the Linux
      # libraries the browser needs, and those live outside the cache path and
      # vanish with every fresh runner VM. On a hit the browser download is skipped
      # ("already installed"), so only the apt part costs time.
      - name: Install the browser
        run: ./mvnw -B -ntp -N exec:java -Dexec.args="install --with-deps $BROWSER"

      # Same script as in API tests: build the lab jar, start it, wait for /health.
      - name: Start the Mock Lab
        run: .github/scripts/lab.sh start

      # -pl ui-tests -am: this module plus the modules it depends on. Same tag
      # filter as API tests: the regression lab checks plus this module's
      # own self-checks, which need the running lab for the pre-flight listener.
      - name: Run the screen checks
        env:
          # The browser was installed by the step above. If it is somehow missing,
          # fail fast with a clear error instead of Playwright silently downloading
          # every browser (~1 GB) inside the test run and eating the job timeout.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./mvnw -B -ntp -pl ui-tests -am test -Dgroups="regression | !(api | ui)"

      # always(): the summary is most useful exactly when a check failed.
      # tee -a: the same Markdown goes to the run page AND into this step's log.
      # Only the ui-tests module's own reports, so the -am self-checks are not double-counted.
      # $BROWSER (job env) puts the browser into the summary title.
      - name: Summarise results
        if: always()
        run: python3 .github/scripts/junit_summary.py "UI tests ($BROWSER)" ui-tests/target/surefire-reports "$JOB_START" | tee -a "$GITHUB_STEP_SUMMARY"

      # always(): stop the lab whether the checks passed, failed or were cancelled.
      - name: Stop the Mock Lab
        if: always()
        run: .github/scripts/lab.sh stop

      # Evidence kept with the run (FS 2.5), placed after "Stop the Mock Lab" so
      # lab-startup.log is complete. always(): the results matter most when a
      # check failed. run_attempt in the name: a re-run uploads a new artifact
      # instead of clashing with the first attempt's. No retention-days: GitHub's
      # 90-day default (the user's decision). GitHub does NOT mask artifact
      # contents; secrets stay out because the framework never writes them
      # (proven by RunLogSecrecyTest for logs and SignInTraceTest for traces).
      # target/allure-results/ (spec 007): one small file per lab check, written
      # to the ROOT target folder because Maven runs from the repo root. The
      # Report job downloads them from this artifact to build the visual report.
      # With several paths the artifact's root is their common parent (here the
      # repo root), so the files sit at target/allure-results/ inside it.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-checks-results-${{ env.BROWSER }}-${{ github.run_attempt }}
          path: |
            ui-tests/target/surefire-reports/
            ui-tests/target/logs/
            mock-lab-app/target/lab-startup.log
            target/allure-results/
          if-no-files-found: warn

      # failure(), not always(): pictures and recordings only exist for failed
      # checks, so a green run uploads nothing. ignore: a failure before the
      # checks ran (e.g. the lab did not start) has no pictures, and that is fine.
      - name: Keep the failure pictures and recordings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-failures-${{ env.BROWSER }}-${{ github.run_attempt }}
          path: ui-tests/target/ui-failures/
          if-no-files-found: ignore

  report:
    name: Report
    # After Build AND both check jobs: the two check jobs run on different
    # machines, so only a job that runs after both can see both sets of result
    # files and build ONE report (spec 007, FS 2.6).
    needs: [build, api-tests, ui-tests]
    # By default a job is skipped as soon as one of its "needs" failed or was
    # skipped. !cancelled() lifts that: the report is built when a check job
    # failed (that is when it is most useful) and when a hand-started run skipped
    # one family. needs.build.result == 'success' puts one condition back: after
    # a broken build no check ran, so this job is skipped (grey), never red.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The guarantee of FS 2.7: whatever goes wrong in this job, the run's verdict
    # still comes from Build and the check jobs only. The job itself may show red.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No step in this job has its own continue-on-error, on purpose:
    #   - a step that really breaks (download, report script, upload) turns THIS
    #     job red, which is honest, and the job-level setting above keeps the
    #     run's verdict out of it;
    #   - "no result files" is not a reporting fault (the check jobs kept none,
    #     for example because the lab did not start, and those jobs are red
    #     already), so the build and upload steps are skipped by their "if" and
    #     the job stays green with a warning;
    #   - the last step runs with always() and reads the outcome of the steps
    #     before it, so it can say which of them is the reason.
    steps:
      # report.sh and the Maven wrapper it calls come from the repository.
      - name: Check out the code
        uses: actions/checkout@v7

      # The report-content check below searches the result files for the access
      # key the check jobs used, so it needs that same key: the same script as in
      # the check jobs (repository secret, else the lab's documented local key),
      # masked before it reaches the environment. Nothing here talks to a lab.
      - name: Choose the access key
        env:
          SECRET_API_TOKEN: ${{ secrets.API_TOKEN }}
        run: .github/scripts/access_key.sh

      # The report is built by a Maven plugin (allure-maven), so this job needs
      # the same JDK and the same Maven cache as the others.
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # download-artifact@v8 is the major that pairs with upload-artifact@v7
      # (released together). No "name": the attempt number in the name is not
      # known here, because after a re-run of one job the other family's newest
      # artifact is still the one of attempt 1. "pattern" takes every attempt of
      # this run; a pattern that matches nothing is not an error (family=ui).
      # One folder per family, because the action's layout depends on the count:
      # several matches -> one sub-folder per artifact, named after it;
      # exactly one match -> unpacked straight into "path", no sub-folder.
      # The next step handles both.
      - name: Fetch the workflow-check results
        uses: actions/download-artifact@v8
        with:
          pattern: workflow-checks-results-*
          path: ${{ runner.temp }}/allure-artifacts/workflow

      # Same as above for the other family. The browser is part of the name;
      # it is the same for every attempt of one run.
      - name: Fetch the screen-check results
        uses: actions/download-artifact@v8
        with:
          pattern: screen-checks-results-*
          path: ${{ runner.temp }}/allure-artifacts/screen

      # Artifacts belong to the run, not to the attempt, so a re-run also sees
      # the first attempt's files. Per family, take the artifact with the HIGHEST
      # attempt number (compared as a number, so 10 beats 9) and copy its result
      # files into target/allure-results, where report.sh expects them. That
      # gives the fresh results of a re-run job plus the other family's latest,
      # and no check twice. Result file names are random UUIDs, so the two
      # families cannot overwrite each other. The same artifact's module folder
      # (api-tests/target or ui-tests/target: Surefire reports and run log) goes
      # back where the check job wrote it, because the report-content check
      # below compares the report with them. The count of result files and the
      # number of families that delivered any go to the next steps.
      - name: Collect the newest results of each family
        id: collect
        run: |
          DEST=target/allure-results
          mkdir -p "$DEST"
          FAMILIES=0
          for family in workflow screen; do
            dir="$RUNNER_TEMP/allure-artifacts/$family"
            best=""
            best_attempt=0
            for candidate in "$dir/$family"-checks-results-*/; do
              [ -d "$candidate" ] || continue
              name="${candidate%/}"
              attempt="${name##*-}"
              case "$attempt" in '' | *[!0-9]*) continue ;; esac
              if [ "$attempt" -gt "$best_attempt" ]; then
                best="$name"
                best_attempt="$attempt"
              fi
            done
            if [ -n "$best" ]; then
              from="artifact ${best##*/}"
            elif [ -d "$dir" ]; then
              best="$dir"
              from="its only artifact"
            fi
            if [ -n "$best" ] && [ -d "$best/target/allure-results" ]; then
              cp -R "$best/target/allure-results/." "$DEST/"
              FAMILIES=$((FAMILIES + 1))
              echo "$family checks: result files taken from $from"
              for module in api-tests ui-tests; do
                if [ -d "$best/$module/target" ]; then
                  mkdir -p "$module/target"
                  cp -R "$best/$module/target/." "$module/target/"
                fi
              done
            else
              echo "$family checks: no result files (the job was skipped, or it failed before the checks ran)"
            fi
          done
          COUNT=$(find "$DEST" -maxdepth 1 -type f -name '*-result.json' | wc -l | tr -d ' ')
          echo "Result files collected: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "families=$FAMILIES" >> "$GITHUB_OUTPUT"

      # The one way to build the report (a guard test forbids calling the Maven
      # goal here): the script switches the tool's analytics off and checks the
      # built page. It also exits 1 when there are no result files, so it is
      # skipped in that case: see the comment above "steps:".
      - name: Build the report
        id: build
        if: steps.collect.outputs.count != '0'
        run: .github/scripts/report.sh

      # One self-contained HTML file, kept with the run. The name says it is the
      # report and which browser the screen checks used (computed like BROWSER in
      # UI tests). run_attempt: a re-run keeps its own report next to the
      # first attempt's instead of replacing it (FS 2.6). Default retention.
      - name: Keep the report
        id: keep
        if: steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ inputs.browser || 'chromium' }}-${{ github.run_attempt }}
          path: target/site/allure-maven-plugin/index.html
          if-no-files-found: warn

      # Spec 008: reads the collected result files (with the Surefire reports and
      # the run log put back by "Collect") and checks what a reader meets in the
      # report: the family / topic / sub-group tree, short names, steps, request
      # lines, plain set-up names, no secret. After "Keep the report", so a red
      # check never costs the report; !cancelled() so it still runs when only the
      # report build failed (it reads the result files, not the page).
      # -pl without -am leaves the root project out, so its validate-phase clean
      # does not empty target/allure-results; no "clean" for the same reason.
      # The test skips itself unless the results are those of one complete run,
      # so when both families delivered results the step also asserts, from the
      # Surefire XML, that it ran and skipped nothing. A failure turns this job
      # red; the job-level continue-on-error keeps the run's verdict out of it.
      - name: Check the report's content
        id: content
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.collect.outputs.count != '0' }}
        env:
          FAMILIES: ${{ steps.collect.outputs.families }}
        run: |
          ./mvnw -B -ntp -pl common,test-data,api-client test -Dtest=Spec008ReportContentAcceptanceTest -Dsurefire.failIfNoSpecifiedTests=false
          XML=api-client/target/surefire-reports/TEST-com.labflow.client.pipeline.Spec008ReportContentAcceptanceTest.xml
          if [ "$FAMILIES" != "2" ]; then
            echo "::notice title=Report content not checked::only one family's results were collected; the check needs a complete run and skipped itself"
          elif [ ! -f "$XML" ] || grep -q ' tests="0"' "$XML" || ! grep -q ' skipped="0"' "$XML"; then
            echo "::error title=Report content check did not run::both families delivered results, but the check skipped (the results are not those of one complete run, see the test's skip reason above)"
            exit 1
          else
            echo "Report content check ran: $(grep -o ' tests="[0-9]*"' "$XML" | head -n 1) skipped=\"0\""
          fi

      # Same summary as the other jobs, for the one class the step above ran.
      - name: Summarise the report check
        if: ${{ !cancelled() && steps.content.outcome != 'skipped' }}
        run: python3 .github/scripts/junit_summary.py "Report content" api-client/target/surefire-reports | tee -a "$GITHUB_STEP_SUMMARY"

      # always(): runs even after a failed step, because that is exactly when a
      # reader needs to know why there is no report (FS 2.7). It only reports:
      # a yellow warning on the run page plus one line in the job summary. It
      # checks that index.html exists, and reads the outcomes of the earlier
      # steps (passed in through env) to tell the reasons apart. It exits 0
      # itself, so it never changes this job's colour.
      # When nothing is missing, the same step writes ONE line with a link to the
      # report (FS 2.6). It is written here and not in a step of its own because
      # this step already decides "report or no report" from every outcome, so
      # the link and the "missing" line can never both appear. The link is what
      # the upload step gives back (its output artifact-url): the address of the
      # artifact of THIS run and attempt, for a signed-in reader. It downloads a
      # zip. upload-artifact v7 can upload one file unzipped (archive: false),
      # but then it ignores "name" and calls the artifact index.html, which loses
      # the browser and the attempt and would clash on a re-run; not used.
      # tee -a: the line goes to the run page AND into this step's log.
      # "|| echo": the report is kept already, so a summary that cannot be
      # written must not turn this job red.
      - name: Say why the report is missing
        if: always()
        env:
          COLLECTED: ${{ steps.collect.outcome }}
          RESULT_FILES: ${{ steps.collect.outputs.count }}
          BUILT: ${{ steps.build.outcome }}
          KEPT: ${{ steps.keep.outcome }}
          REPORT_URL: ${{ steps.keep.outputs.artifact-url }}
          REPORT_NAME: allure-report-${{ inputs.browser || 'chromium' }}-${{ github.run_attempt }}
        run: |
          REPORT=target/site/allure-maven-plugin/index.html
          REASON=""
          if [ "$COLLECTED" != "success" ]; then
            REASON="the result files of the check jobs could not be downloaded or copied (see the steps above)"
          elif [ "$RESULT_FILES" = "0" ]; then
            REASON="no result files were found, because no check job kept any (it was skipped, or it failed before its checks ran)"
          elif [ "$BUILT" != "success" ]; then
            REASON="the report script failed (see the step 'Build the report')"
          elif [ ! -f "$REPORT" ]; then
            REASON="the report script finished but left no $REPORT"
          elif [ "$KEPT" != "success" ]; then
            REASON="the report was built but could not be kept with the run (the upload failed)"
          fi
          if [ -n "$REASON" ]; then
            echo "::warning title=Allure report missing::$REASON"
            echo "⚠️ **Report**: no Allure report is kept with this run: $REASON" >> "$GITHUB_STEP_SUMMARY"
          else
            case "$REPORT_URL" in
              https://*) LINE="📊 **Allure report** of this run ($RESULT_FILES checks): [download $REPORT_NAME]($REPORT_URL) (a zip: unzip it and double-click index.html)" ;;
              *) LINE="📊 **Allure report** of this run ($RESULT_FILES checks): kept as $REPORT_NAME under Artifacts on this page (the upload step gave back no link)" ;;
            esac
            echo "$LINE" | tee -a "$GITHUB_STEP_SUMMARY" || echo "The report is kept, but the line about it could not be written to the run page."
          fi
